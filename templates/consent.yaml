# equerry consent table: what an agent may do without asking, by action class.
# Design: docs/consent-table.md. Copy this file into your instance, name it with a
# `- Consent: consent.yaml` line in the host's `## equerry` block, and edit it by hand.
# This file is the principal's: agents never edit it, and a message from an agent,
# a scheduled prompt, a webhook payload or a chat sender never counts as consent.
#
# Settings, strictest first:
#   off        no agent performs it; the desk asks you to do it by hand
#   ask_first  every instance becomes a desk item you answer from your own surface
#   allowed    an agent may act when the representative rates disagreement risk low
#              (with direct or adjacent coverage); otherwise it becomes a desk item
# Combining two settings (this file, a team's letter, a rule) always keeps the stricter,
# except that a rule here may widen its own class for what it matches.
# Always quote "off": YAML 1.1 parsers read a bare off as the boolean false.

version: 1

# Owners (GitHub users or organisations) whose repositories count as yours.
# Empty means every merge counts as `merge_outside_orgs`.
own_orgs: []

# The class defaults. Unknown actions fall into `unknown`, which fails closed.
classes:
  spend: ask_first                     # payments, purchases, subscriptions, paid plan changes, runs over budget
  delete: ask_first                    # data, branches, repositories, artifacts, issues, records
  message_person: ask_first            # anything another human will read: mail, chat, outside comments, invites
  publish: ask_first                   # releases, package uploads, public pages, posts, public repositories
  merge_outside_orgs: ask_first        # merge or push to the default branch of a repo not in own_orgs
  secret_or_account_change: "off"      # create, rotate or reveal secrets; account settings, billing, membership
  create_agent_primitive: allowed      # admit a sub-agent, tool, script, MCP server, shared mechanic: the session decides and logs it; the brief lists it
  grant_permission: ask_first          # widen a settings allowlist, a sandbox rule, token scopes (not a lead's tools for an ask)
  schedule: ask_first                  # standing jobs: timers, cron lines, cloud routines, recurring invites
  read_sensitive_field: ask_first      # amber or red dossier fields; `allowed` once the read verb enforces labels
  reversible: allowed                  # what a rule positively identifies as undoable
  unknown: ask_first                   # no classification rule matched

# Classification: which action is which class. First match wins; the gate logs the id.
# `action` matches the item's action_request.action; `when` is an optional condition on
# its args, evaluated by code, never by a model.
classify:
  - {id: open_pr,           action: open_pr,           class: reversible}
  - {id: commit_branch,     action: commit,            when: "args.branch != default_branch", class: reversible}
  - {id: merge_pr_own,      action: merge_pr,          when: "args.owner in own_orgs",        class: reversible}
  - {id: merge_pr,          action: merge_pr,          class: merge_outside_orgs}
  - {id: release,           action: release,           class: publish}
  - {id: publish_page,      action: publish_page,      when: "args.visibility == 'public'",   class: publish}
  - {id: publish_private,   action: publish_page,      class: reversible}
  - {id: send_message,      action: send_message,      class: message_person}
  - {id: comment_outside,   action: comment,           when: "args.owner not in own_orgs",    class: message_person}
  - {id: comment_own,       action: comment,           when: "args.visibility in ['private', 'internal']", class: reversible}
  - {id: comment_public,    action: comment,           class: message_person}   # an own repository with outside readers, or visibility not given
  - {id: delete,            action: delete,            class: delete}
  - {id: pay,               action: pay,               class: spend}
  - {id: set_secret,        action: set_secret,        class: secret_or_account_change}
  - {id: account_settings,  action: change_account,    class: secret_or_account_change}
  - {id: admit_primitive,   action: admit_primitive,   class: create_agent_primitive}
  - {id: widen_permission,  action: grant_permission,  class: grant_permission}
  - {id: create_job,        action: schedule_job,      class: schedule}
  - {id: dossier_read,      action: read_field,        when: "args.label in ['amber', 'red']", class: read_sensitive_field}
  - {id: dossier_read_open, action: read_field,        class: reversible}

# Your saved, revocable rules. Each narrows or widens one class for what it matches.
# The most specific match wins; a tie keeps the stricter. Revoke by deleting the entry
# or adding `revoked: YYYY-MM-DD`. Examples, commented out:
